name: verify

# The suite has no dependencies and needs no DSH and no browser, so it runs
# everywhere and finishes in about a second. That is the point: the two
# guarantees this plugin is about — "sound cannot reach full screen" and "the
# animation always gives the screen back" — are asserted on every push instead of
# being trusted.
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm run verify
